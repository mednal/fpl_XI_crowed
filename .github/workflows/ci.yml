name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Placeholders only. Nothing here reaches a real project: the build never
      # calls Supabase, and `isConfigured` is all these values decide. The real
      # keys live in Vercel's environment.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      VOTER_SECRET: placeholder-ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rules under test
        run: npm test

      - name: Production build
        run: npm run build
